<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your SkyRoute account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="register">

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="/"><span class="logo-mark">✈</span> SkyRoute Airways</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/register" class="active">Create account</a>
      <a class="btn btn-ghost btn-small" href="/login">Sign in</a>
    </nav>
  </div>
</header>

<main class="auth">
  <div class="wrap" style="display:grid;place-items:center">
    <div class="form-card">
      <div class="form-head">
        <h1>Create your traveller profile</h1>
        <p>Name and date of birth must match the ID you carry to the airport.</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="msg" id="formMsg"></div>

        <div class="grid-2">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Ravi Kumar" />
            <div class="error" data-error-for="fullName"></div>
          </div>

          <div class="field">
            <label for="dob">Date of birth</label>
            <input type="date" id="dob" name="dob" />
            <div class="error" data-error-for="dob"></div>
          </div>

          <div class="field">
            <label>Gender</label>
            <div class="radio-row">
              <label><input type="radio" name="gender" value="Male" /> Male</label>
              <label><input type="radio" name="gender" value="Female" /> Female</label>
              <label><input type="radio" name="gender" value="Other" /> Other</label>
            </div>
            <div class="error" data-error-for="gender"></div>
          </div>

          <div class="field">
            <label for="mobile">Mobile number</label>
            <input type="tel" id="mobile" name="mobile" maxlength="10" placeholder="9876543210" />
            <div class="error" data-error-for="mobile"></div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="ravi@gmail.com" />
            <div class="error" data-error-for="email"></div>
          </div>

          <div class="field">
            <label for="passport">Passport number <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
            <input type="text" id="passport" name="passport" placeholder="Needed for international flights" />
            <div class="error" data-error-for="passport"></div>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="ravi123" />
            <div class="error" data-error-for="username"></div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" />
            <div class="error" data-error-for="password"></div>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" />
            <div class="error" data-error-for="confirm"></div>
          </div>

          <div class="field">
            <label for="city">Home airport city</label>
            <select id="city" name="city">
              <option value="">Choose a city</option>
              <option>Hyderabad</option>
              <option>Delhi</option>
              <option>Mumbai</option>
              <option>Bengaluru</option>
              <option>Chennai</option>
              <option>Kolkata</option>
            </select>
            <div class="error" data-error-for="city"></div>
          </div>
        </div>

        <div class="field">
          <label for="address">Billing address</label>
          <textarea id="address" name="address" placeholder="Flat, street, area, city, PIN"></textarea>
          <div class="error" data-error-for="address"></div>
        </div>

        <button type="submit" class="btn btn-block" id="submitBtn">Create account</button>

        <div class="form-foot">
          <small>Already flying with us? <a href="/login">Sign in</a></small>
          <small><a href="/">Back to home</a></small>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="/js/script.js"></script>
</body>
</html>
